<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SETTLED — đối chiếu biên lai</title>
<style>
  :root{--bg:#0b0e12;--card:#12171e;--line:#222b36;--fg:#e6edf3;--mut:#8b98a8;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--acc:#60a5fa}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:18px}
  h1{font-size:26px;letter-spacing:.18em;margin:0;color:var(--acc)}
  .tag{color:var(--mut);font-size:13px}
  .badges{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .badge{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:10px;color:var(--ok);letter-spacing:.08em}
  .hero{margin:22px 0;padding:18px 20px;border:1px solid var(--acc);border-left:4px solid var(--acc);background:#0e1723;border-radius:6px;font-size:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
  .card h2{margin:0 0 12px;font-size:11px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
  .big{font-size:27px;font-weight:700;letter-spacing:-.02em}
  .big.ok{color:var(--ok)} .big.warn{color:var(--warn)} .big.bad{color:var(--bad)}
  .sub{color:var(--mut);font-size:12px;margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--mut);font-weight:500;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  td.n{text-align:right;white-space:nowrap}
  .raw{color:var(--mut);font-size:10px;word-break:break-all;max-width:230px}
  section{margin-top:26px}
  section>h2{font-size:12px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:8px}
  .dis{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:6px;padding:12px 14px;margin-bottom:8px}
  .dis b{color:var(--warn);font-size:11px;letter-spacing:.1em}
  .dis div{font-size:12px;margin-top:4px;color:var(--fg)}
  .dis .res{color:var(--mut)}
  footer{margin-top:34px;border-top:1px solid var(--line);padding-top:14px;color:var(--mut);font-size:11px}
  a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
  .pill{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SETTLED</h1>
    <span class="tag" id="tagline">đối chiếu biên lai</span>
    <div class="badges">
      <span class="badge">NO KEY</span><span class="badge">NO TX</span>
      <span class="badge">NO USD GUESS</span><span class="badge">NO SCORING</span>
    </div>
  </header>

  <div class="hero" id="hero">đang tải…</div>

  <div class="grid" id="cards"></div>

  <section>
    <h2>Bất đồng giữa các nguồn</h2>
    <div id="dis"></div>
  </section>

  <section>
    <h2>Tiền còn trong contract — block <span id="blk">?</span></h2>
    <table><thead><tr><th>Contract</th><th>Số người đọc</th><th class="n">Raw</th><th>Admin</th><th>Code</th></tr></thead><tbody id="hold"></tbody></table>
    <div class="sub" id="cashnote"></div>
  </section>

  <section>
    <h2>Volume báo cáo vs tiền thật thu</h2>
    <table><thead><tr><th>Nguồn</th><th>Reported</th><th>Settled</th><th class="n">Tỉ lệ</th></tr></thead><tbody id="vol"></tbody></table>
  </section>

  <section>
    <h2>Governance — giá của một cú takeover</h2>
    <div id="gov"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? 'n/a' : n >= 1e9 ? '$'+(n/1e9).toFixed(2)+'B' : n >= 1e6 ? '$'+(n/1e6).toFixed(2)+'M' : n >= 1e3 ? '$'+(n/1e3).toFixed(1)+'K' : '$'+Number(n).toFixed(2);
const nfmt = (n,d=2) => n == null ? 'n/a' : Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const rfmt = r => r.reportedUnit === 'transactions' ? nfmt(r.reported/1e6,1)+'M tx' : fmt(r.reported);

fetch('/api/report').then(r => r.json()).then(rep => {
  const s = rep.sections, d = s.deadCapital, l = s.liveness, g = s.governance, v = s.volumeQuality;
  $('#tagline').textContent = rep.tagline;
  $('#hero').textContent = rep.headline;
  $('#blk').textContent = nfmt(l.block, 0);

  const cards = [
    ['TRACKER NÓI', fmt(d.claimedUsd), d.disagreement ? 'bad' : 'ok', 'DefiLlama currentChainTvls.Moonriver'],
    ['ON-CHAIN CÒN', d.nonZeroBalances + ' contract', d.disagreement ? 'warn' : 'ok', 'số dư khác 0, ' + d.contractsWithCode + ' contract còn code'],
    ['CHAIN', l.status, 'warn', 'block ' + nfmt(l.block,0) + ' · ' + l.independentEndpoints + ' endpoint độc lập'],
    ['FEE / DEX VOLUME', nfmt(v.rows[0].ratioBps,2) + ' bps', 'ok', 'xếp theo phí, không xếp theo volume'],
  ];
  $('#cards').innerHTML = cards.map(c =>
    '<div class="card"><h2>'+esc(c[0])+'</h2><div class="big '+c[2]+'">'+esc(c[1])+'</div><div class="sub">'+esc(c[3])+'</div></div>'
  ).join('');

  $('#dis').innerHTML = rep.disagreements.map(x =>
    '<div class="dis"><b>'+esc(x.id)+'</b><div>A: '+esc(x.a)+'</div><div>B: '+esc(x.b)+'</div><div class="res">→ '+esc(x.resolution)+'</div></div>'
  ).join('');

  $('#hold').innerHTML = d.holdings.map(h =>
    '<tr><td>'+esc(h.name)+'<div class="raw">'+esc(h.address)+'</div></td>'+
    '<td class="n">'+(h.humanAmount == null ? 'n/a' : '<b>'+nfmt(h.humanAmount,4)+'</b> '+esc(h.unit))+'</td>'+
    '<td class="n raw">'+esc(h.raw)+'</td><td class="raw">'+esc(h.admin)+'</td><td class="n">'+h.codeBytes+' B</td></tr>'
  ).join('');
  $('#cashnote').textContent = d.noPriceReason + ' · ' + esc(d.claimedSource);

  $('#vol').innerHTML = v.rows.map(r => {
    const ratio = r.ratioBps != null ? nfmt(r.ratioBps,2)+' bps'
      : r.cashRatio != null ? nfmt(r.cashRatio*100,1)+'% cash'
      : nfmt(r.avgSettlementPerTxUsd,4)+' USD/tx';
    return '<tr><td>'+esc(r.name)+'<div class="sub">'+esc(r.reportedUnit)+'</div></td><td class="n">'+rfmt(r)+'</td><td class="n">'+fmt(r.settled)+'</td><td class="n">'+ratio+'</td></tr>';
  }).join('');

  const hi = g.historicalIncident;
  $('#gov').innerHTML = '<div class="grid">' +
    '<div class="card"><h2>Quorum / Threshold</h2><div class="big">'+nfmt(g.quorumTokens,0)+'</div><div class="sub">threshold '+nfmt(g.proposalThresholdTokens,0)+' MFAM · '+g.proposalCount+' proposal</div></div>' +
    '<div class="card"><h2>Cửa sổ phản ứng</h2><div class="big">'+nfmt((g.votingPeriodSeconds+g.timelockDelaySeconds)/3600,0)+' h</div><div class="sub">votingPeriod '+g.votingPeriodSeconds+'s + timelock '+g.timelockDelaySeconds+'s</div></div>' +
    '<div class="card"><h2>MIP-R39</h2><div class="big bad">1:'+hi.ratioCostToTreasury+'</div><div class="sub">'+fmt(hi.costUsd)+' mua phiếu → '+fmt(hi.treasuryUsd)+' · '+esc(hi.outcome)+'</div></div>' +
    '<div class="card"><h2>Parameter drift</h2><div class="big '+(g.parameterDrift?'warn':'ok')+'">'+(g.parameterDrift?'CÓ':'KHÔNG')+'</div><div class="sub">'+esc(g.driftNote)+'</div></div>' +
    '</div>';

  $('#foot').innerHTML = '<div>'+esc(rep.limits.join(' · '))+'</div>' +
    '<div style="margin-top:8px">Nguồn: '+Object.values(rep.meta.sources).map(x=>esc(x)).join(' · ')+'</div>' +
    '<div style="margin-top:8px">'+esc(rep.meta.generatedAt)+' · '+esc(rep.meta.mode)+'</div>';
}).catch(e => { $('#hero').textContent = 'Lỗi tải /api/report: ' + e.message; });
</script>
</body>
</html>
