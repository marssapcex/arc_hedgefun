name: vulnchain
on:
  push:
    paths:
      - 'vulnchain/**'
      - '.github/workflows/vulnchain.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vulnchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install (single package.json)
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build 821-incident corpus
        run: node src/cli.js build-corpus
      - name: Offline fixture + selftest
        run: |
          node src/cli.js make-fixture
          node src/cli.js selftest
      - name: Full-chain checkpoint smoke (genesis range)
        continue-on-error: true
        run: |
          node src/cli.js full-scan --from-block 0 --to-block 400 \
            --chunk 100 --max-chunks 4 --resume
      - name: Live single-chain function labelling
        run: |
          node src/cli.js scan --network ethereum --blocks 40 --mode hybrid \
            --max-contracts 60 --sourcify 2>&1 | tee /tmp/vulnchain_scan.log
      - name: Publish results
        if: always()
        working-directory: .
        run: |
          cp /tmp/vulnchain_scan.log vulnchain/data/scan_debug.log 2>/dev/null || true
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -f vulnchain/data/corpus.json vulnchain/data/scan_result.json \
                     vulnchain/data/full_scan_state.json vulnchain/data/full_scan_labels.jsonl \
                     VULNCHAIN_REPORT.md || true
          git commit -m "data: vulnchain live similarity scan [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do git push origin HEAD:arena/fbf9cf32-arc-hedgefun && break || sleep 5; done
