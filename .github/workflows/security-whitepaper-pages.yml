name: Publish security whitepaper

on:
  push:
    branches:
      - arena/beddaa46-arc-hedgefun
    paths:
      - 'audit/**'
      - '.github/workflows/security-whitepaper-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload whitepaper site
        uses: actions/upload-pages-artifact@v3
        with:
          path: audit
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
