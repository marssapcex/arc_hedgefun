name: rpc-jared
on:
  push:
    paths:
      - '.github/workflows/rpc-jared.yml'
      - 'scripts/rpc_jared.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read-only JaredFromSubway drain check
        run: |
          python3 scripts/rpc_jared.py --out rpc_jared_raw.json --md JARED_ONCHAIN.md 2>&1 | tee jared_run.log || true
          ls -la rpc_jared_raw.json JARED_ONCHAIN.md jared_run.log || true
      - name: Publish results
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -f rpc_jared_raw.json JARED_ONCHAIN.md jared_run.log || true
          git commit -m "data: JaredFromSubway drain on-chain probe [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do git push origin HEAD:arena/fbf9cf32-arc-hedgefun && break || sleep 5; done
