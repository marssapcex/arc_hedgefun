name: test
on:
  push:
    paths:
      - '.github/workflows/test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch DefiLlama snapshots
        run: |
          set -e
          mkdir -p /tmp/llama
          curl -sS --retry 3 --max-time 120 https://api.llama.fi/lite/protocols2 -o /tmp/llama/protocols2.json
          curl -sS --retry 3 --max-time 120 https://api.llama.fi/protocols -o /tmp/llama/protocols_full.json
          curl -sS --retry 3 --max-time 120 https://api.llama.fi/v2/chains -o /tmp/llama/chains.json
          curl -sS --retry 3 --max-time 120 https://api.llama.fi/config/smol/appMetadata-protocols.json -o /tmp/llama/appmeta.json
          ls -la /tmp/llama/
      - name: Screen and publish result
        run: |
          set -e
          python3 scripts/llama_screen.py
          ls -la screen.json
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add screen.json
          git commit -m "data: one-off llama screen [skip ci]" || echo "nothing to commit"
          git push origin HEAD:arena/fbf9cf32-arc-hedgefun
